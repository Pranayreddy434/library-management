services:
  # Backend Service
  - type: web
    name: library-management-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
        placeholder: "jdbc:mysql://YOUR_UPSTASH_HOST:PORT/db?ssl-mode=REQUIRED"
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
        placeholder: "your_upstash_username"
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: redis
          name: library-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

  # Redis Service (Managed)
  - type: redis
    name: library-redis
    plan: starter # Render managed Redis requires a paid plan
    ipAllowList: [] # Internal only for security

  # Frontend Service
  - type: web
    name: library-management-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://library-management-backend.onrender.com/api
