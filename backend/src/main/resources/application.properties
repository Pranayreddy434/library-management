spring.application.name=library-management-backend

# Cache configuration (defaults to none for local dev)
spring.cache.type=${SPRING_CACHE_TYPE:none}
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}
spring.data.redis.repositories.enabled=false

# Supabase (PostgreSQL) DataSource via IPv4 Connection Pooler
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.lcxwrtuzowmoqecufngi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:20g21a0434@P}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Keep small to stay well within Supabase 15-connection session limit)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

# SQL initial seed
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# Mail configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT settings
jwt.secret=${JWT_SECRET:7a4b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

openlibrary.base-url=https://openlibrary.org

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
