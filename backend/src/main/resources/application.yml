spring:
  application:
    name: library-management-backend

  datasource:
    # 🔴 IMPORTANT:
    # Do NOT default to localhost for cloud platforms
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  # ✅ MAIL CONFIG (OTP / EMAIL)
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ✅ JWT CONFIG
jwt:
  # MUST be >= 32 characters
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION:86400000}

# ✅ External API
openlibrary:
  base-url: https://openlibrary.org

# ✅ SERVER (Render injects PORT automatically)
server:
  port: ${PORT:8080}

# ✅ ACTUATOR (required for health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
