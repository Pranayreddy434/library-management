spring:
  application:
    name: library-management-backend

  cache:
    type: ${SPRING_CACHE_TYPE:none}

  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}

  datasource:
    # 🔴 IMPORTANT:
    # Do NOT default to localhost for cloud platforms
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:20g21a0434_P}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  # ✅ MAIL CONFIG (OTP / EMAIL)
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ✅ JWT CONFIG
jwt:
  # MUST be >= 32 characters
  secret: ${JWT_SECRET:7a4b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b}
  expiration-ms: ${JWT_EXPIRATION:86400000}

# ✅ External API
openlibrary:
  base-url: https://openlibrary.org

# ✅ SERVER (Render injects PORT automatically)
server:
  port: ${PORT:8080}

# ✅ ACTUATOR (required for health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
